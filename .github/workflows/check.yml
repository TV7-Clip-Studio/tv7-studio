name: Studio checks
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tv7-studio
      - uses: actions/checkout@v4
        with:
          repository: TV7-Clip-Studio/tv7-engine
          ref: ca4d0e45a135533113f30c93b647736989b50f5b
          path: tv7-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tv7-studio/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libssl-dev pkg-config
      - run: cargo build --locked -p engine-service
        working-directory: tv7-engine
      - run: npm ci && npm audit --audit-level=low && make check
        working-directory: tv7-studio
      - run: npx --no-install playwright install --with-deps chromium && npm run test:e2e
        working-directory: tv7-studio
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: tv7-studio/test-results
          if-no-files-found: ignore
