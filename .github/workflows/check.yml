name: Studio checks
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tv7-studio
      - uses: actions/checkout@v4
        with:
          repository: TV7-Clip-Studio/tv7-engine
          ref: 60dd8b03422f37104ad6f0996de79436a90595d7
          path: tv7-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tv7-studio/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libssl-dev pkg-config
      - run: cargo build --locked -p engine-service
        working-directory: tv7-engine
      - run: npm ci && make check
        working-directory: tv7-studio
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: tv7-studio
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: tv7-studio/test-results
          if-no-files-found: ignore
