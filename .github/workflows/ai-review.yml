name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deepseek-review:
    uses: TV7-Clip-Studio/tv7-core/.github/workflows/deepseek-review.yml@main
    with:
      project_context: "TV7 Studio: React/TypeScript UI in Tauri desktop shell with local Rust Engine sidecar"
      architecture_doc: studio_architecture.md
    secrets: inherit
