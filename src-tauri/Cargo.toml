[package]
name = "tv7-studio"
version = "0.1.0"
description = "TV7 Studio desktop application"
authors = ["TV7"]
edition = "2021"

[lib]
name = "tv7_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
