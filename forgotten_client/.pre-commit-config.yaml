repos:
  - repo: local
    hooks:
      - id: flutter-format
        name: flutter format
        entry: bash
        args: ["-c", "cd forgotten_client && dart format lib test"]
        language: system
        pass_filenames: false
      - id: flutter-analyze
        name: flutter analyze
        entry: bash
        args: ["-c", "cd forgotten_client && flutter analyze"]
        language: system
        pass_filenames: false
      - id: flutter-test
        name: flutter test
        entry: bash
        args: ["-c", "cd forgotten_client && flutter test"]
        language: system
        pass_filenames: false
